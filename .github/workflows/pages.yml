name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 検証・一覧生成に使うパーサー。player.html と同じく main の最新版を使う
      - uses: actions/checkout@v4
        with:
          repository: nanet76th/lrc-call-extension
          path: .lrc-call-extension

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build index.json
        run: node tools/build-index.js --parser .lrc-call-extension/src/clrc-parser.js --out _site/index.json

      - name: Copy site files
        run: cp -r index.html data _site/

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
